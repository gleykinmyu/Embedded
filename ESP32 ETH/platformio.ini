; ESP32 DEVKIT V1 (ESP-WROOM-32), ESP-IDF
; Платформа та же, что в TEST_ESP32_Relay (ESP-IDF 5.3).

[platformio]
src_dir = main

[env:esp32doit-devkit-v1]
extra_scripts = pre:../tools/pio_compiledb.py
lib_extra_dirs = ../libs
; ibyte_stream.hpp лежит в Interfaces, и LDF собирает idisk/*.cpp вместе с FatFs.
; Заголовки интерфейсов подключает CMake, исходники диска этой прошивке не нужны.
lib_ignore = Interfaces
; Имена из libs/*/library.json. Раскомментируйте те, что проект собирает.
; По #include Library Dependency Finder и так найдёт библиотеку в lib_extra_dirs.
; lib_deps =
;     board
;     ccam
;     debug
;     dmx512
;     FatFs
;     Interfaces
;     Nextion
;     showFile
;     smcp
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = espidf
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
