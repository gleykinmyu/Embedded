; Waveshare ESP32-S3-POE-ETH-8DI-8RO — env esp32s3_poe_eth_8di_8ro
; ESP32-ETH01 (LAN8720, только CLI и HTTP) — env esp32_eth01
;
; Важно: ESP-IDF не собирается из папки с пробелом в пути.
; Переименуй каталог проекта, например TEST-ESP32-Relay.

[platformio]
build_dir = ../.pio_core_root/build/TEST-ESP32-Relay

[env:esp32s3_poe_eth_8di_8ro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
extra_scripts = pre:tools/select_board.py
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles =
    src/index.html
build_flags =
    -DRELAY_STEP_MS=500

; ESP32-ETH01: UART-загрузка, LAN8720, CLI + страница статуса.
; pio run -e esp32_eth01 -t upload
[env:esp32_eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = espidf
extra_scripts = pre:tools/select_board.py
board_build.flash_mode = dio
board_upload.flash_size = 4MB
upload_speed = 115200
upload_flags =
    --before=no_reset
    --after=no_reset
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; После первой заливки по USB: pio run -e ota -t upload
[env:ota]
extends = env:esp32s3_poe_eth_8di_8ro
upload_protocol = custom
upload_port = 192.168.6.202
upload_command = $PYTHONEXE $PROJECT_DIR/ota_upload.py $SOURCE $UPLOAD_PORT
