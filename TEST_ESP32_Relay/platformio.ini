; Waveshare ESP32-S3-POE-ETH-8DI-8RO
; ESP-IDF: I2C TCA9554, W5500, esp_http_server
;
; Важно: ESP-IDF не собирается из папки с пробелом в пути.
; Переименуй каталог проекта, например TEST-ESP32-Relay.

[platformio]
build_dir = ../.pio_core_root/build/TEST-ESP32-Relay

[env:esp32s3_poe_eth_8di_8ro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles =
    src/index.html
build_flags =
    -DRELAY_STEP_MS=500

; После первой заливки по USB: pio run -e ota -t upload
[env:ota]
extends = env:esp32s3_poe_eth_8di_8ro
upload_protocol = custom
upload_port = 192.168.6.202
upload_command = $PYTHONEXE $PROJECT_DIR/ota_upload.py $SOURCE $UPLOAD_PORT
