; PUMS Console — STM32F407 + Nextion (example7: McUI overlay)
;
; Библиотеки: Embedded/libs/ (lib_extra_dirs + library.json)
; Приложение: ../../libs/Nextion/examples/example7/app.hpp
;
; clangd: pio run -t compiledb (из этой папки)
; Cursor: .vscode/settings.json.example → settings.json
;
; HMI → src/UI/nexHmiConfig.hpp (Nextion library.json → syncHMI/pio_hmi_gen.py):
;   custom_hmi_gen  = off | onchange | always   (или 0 | 1 | 2)
;   custom_hmi_file = путь к .HMI относительно корня проекта
;   custom_hmi_out  = выходной .hpp (по умолчанию src/UI/nexHmiConfig.hpp)

[platformio]
default_envs = console

[env:console]
platform = ststm32
board = genericSTM32F407VGT6
board_build.ldscript = ldscripts/STM32F407VGTX_FLASH.ld
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 250000

lib_extra_dirs = ../../libs

lib_deps =
    FatFs
    Interfaces
    board
    Nextion

; Генерация nexHmiConfig.hpp (скрипт из lib Nextion, см. library.json extraScript)
custom_hmi_gen = always
custom_hmi_file = src/PUMS 2.5.HMI
; custom_hmi_out = src/UI/nexHmiConfig.hpp

build_flags =
    -std=gnu++17
    -DHSE_VALUE=8000000U
    -DNEX_DEBUG
    ;-DSMCP_DEBUG
    -DSD_DEBUG
    -DNEX_SESSION_QUEUE_CAPACITY=96
    ;-DNEX_TRACE_TX
    ;-DNEX_TRACE_RX 
    -Isrc

monitor_filters = send_on_enter
monitor_echo = yes
