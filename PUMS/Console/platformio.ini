; PUMS Console / Server — STM32F407 + Nextion
;
; Библиотеки: Embedded/libs/ (lib_extra_dirs + library.json)
;
; clangd: pio run -t compiledb -e console -e server -e test
; Cursor: .vscode/settings.json.example → settings.json
;
; HMI → nexHmiConfig.hpp (Nextion library.json → syncHMI/pio_hmi_gen.py):
;   custom_hmi_gen  = off | onchange | always   (или 0 | 1 | 2)
;   custom_hmi_file = путь к .HMI относительно корня проекта
;   custom_hmi_out  = выходной .hpp

[platformio]
; console — пульт (CAN1 PD0/PD1)
; server  — сегмент (CAN1 PD0/PD1)
; test    — оба узла на одном MCU, MockCan loopback (src/main_test.cpp)
default_envs = console

[env]
platform = ststm32
board = genericSTM32F407VGT6
board_build.ldscript = ldscripts/STM32F407VGTX_FLASH.ld
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 250000

lib_extra_dirs = ../../libs

lib_deps =
    FatFs
    Interfaces
    board
    Nextion

custom_hmi_gen = always

build_flags =
    -std=gnu++17
    -DHSE_VALUE=8000000U
    ;-DNEX_DEBUG
    ; SMCP: -DSMCP_DEBUG (= NODE+SESSION+CONSOLE) или по слоям:
    ;-DSMCP_DEBUG
    ;-DSMCP_DBG_NODE
    ;-DSMCP_DBG_SESSION
    ;-DSMCP_DBG_CONSOLE
    ;-DSMCP_DBG_SHOW
    ;-DSMCP_TRACE_LINK
    ;-DSMCP_TRACE_HB
    ;-DSMCP_TRACE_SHORT
    ;-DSD_DEBUG
    -DNEX_SESSION_QUEUE_CAPACITY=256
    ;-DNEX_TRACE_TX
    ;-DNEX_TRACE_RX
    ;-DNEX_OVL_DEBUG
    -Isrc

monitor_filters = send_on_enter
monitor_echo = yes

; Пульт: 10" Nextion, PUMS 2.5.HMI, CAN1 PD0/PD1
[env:console]
custom_hmi_file = src/Console/PUMS 2.5.HMI
custom_hmi_out = src/Console/UI/nexHmiConfig.hpp
build_flags =
    ${env.build_flags}
    -Isrc/Console
    ;-DSMCP_DEBUG
    ;-DSD_DEBUG
    -DNEX_TRACE_TX
    -DNEX_TRACE_RX
    ;-DSMCP_TRACE_LINK
    ;-DSMCP_TRACE_HB
    ;-DCAN_DEBUG
build_src_filter =
    +<*>
    -<main_test.cpp>
    -<Server/>
    -<smcp/mock_can.cpp>

; Сегмент: 4.3" Nextion, Server 1.HMI, CAN1 PD0/PD1
[env:server]
custom_hmi_file = src/Server/Server 1.HMI
custom_hmi_out = src/Server/UI/nexHmiConfig.hpp
build_src_filter =
    +<*>
    -<main_test.cpp>
    -<Console/>
    +<Console/UI/statusBar.cpp>
    -<fat_file.cpp>
    -<smcp/Console/>
    -<smcp/GroupConsole/group_bank.cpp>
    -<smcp/GroupConsole/group_console.cpp>
    -<smcp/mock_can.cpp>
build_flags =
    ${env.build_flags}
    -Isrc/Server
    -DSMCP_DEBUG
    -DSMCP_TRACE_LINK
    -DSMCP_TRACE_SHORT

; Одна плата: консоль + сервер, MockCan loopback
[env:test]
custom_hmi_file = src/Console/PUMS 2.5.HMI
custom_hmi_out = src/Console/UI/nexHmiConfig.hpp
build_flags =
    ${env.build_flags}
    -Isrc/Console
    -Isrc/Server
build_src_filter =
    +<*>
    -<Console/main.cpp>
    -<Server/main.cpp>
    -<Server/UI/>
