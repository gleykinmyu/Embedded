; PUMS relay — Arduino Mega 2560, ATmega2560
;
; Framework Arduino не используется: платформа atmelavr без framework
; собирает голый avr-gcc (заголовки avr/io.h, avr/interrupt.h).
; Слой платы: Embedded/libs/board/mega2560 (только заголовки).
; Векторы: src/avr_isr.cpp подключает isr.hpp ровно один раз.

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
upload_protocol = wiring
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; LDF выключен: заголовки Interfaces подключаются через -I,
; исходники библиотеки board (STM32) в сборку не попадают.
lib_ldf_mode = off

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -fno-rtti
    -I../../libs/board/mega2560/cxx
    -I../../libs/board/mega2560
    -I../../libs/Interfaces
    -Itest/gpio
    -Wl,-u,board_wdt_early_off
