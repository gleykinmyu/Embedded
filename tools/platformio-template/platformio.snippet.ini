; Пути относительно platformio.ini.
; Один ../ на каждый уровень вверх до корня репозитория.
;
; ESP-IDF (framework = espidf) house-rules — libs/cmake/README.md:
;   - не задавать build_dir (дефолт .pio/build)
;   - не использовать EMBED_TXTFILES / board_build.embed_txtfiles
;     → include libs/cmake/pio_idf_embed.cmake
;   - packages/clangd: Embedded/.pio_core_root → ~/.platformio (не build_dir)
extra_scripts = pre:../tools/pio_compiledb.py
lib_extra_dirs = ../libs

; Имена из libs/*/library.json. Раскомментируйте те, что проект собирает.
; По #include Library Dependency Finder и так найдёт библиотеку в lib_extra_dirs.
; lib_deps =
;     board
;     ccam
;     debug
;     dmx512
;     FatFs
;     Interfaces
;     Nextion
;     showFile
;     smcp

