; ESP32-ETH01 → AW-PH350E (RS-422 / UART2), CLI + HTTP + OTA
; Библиотека: ../libs/ccam
;
; Первая прошивка / смена partition table — только по UART:
;   pio run -e esp32_eth01 -t upload
; Дальше по сети (IP по умолчанию 2.0.0.12, пароль esp_cam):
;   pio run -e esp32_eth01_ota -t upload

[platformio]
default_envs = esp32_eth01

[env:esp32_eth01]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = espidf
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
upload_speed = 115200
upload_flags =
    --before=no_reset
    --after=no_reset
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Сетевая загрузка (нужен link + IP). Другой IP:
;   pio run -e esp32_eth01_ota -t upload --upload-port 192.168.6.221
; На чистом espidf штатный espota ломается (нет Arduino framework) —
; pre-script + tools/espota.py.
[env:esp32_eth01_ota]
extends = env:esp32_eth01
upload_protocol = custom
upload_port = 192.168.6.221
extra_scripts = pre:tools/fix_ota_upload.py
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/espota.py" --progress --auth=esp_cam --timeout=60 -i $CUSTOM_ESPOTA_IP -f $SOURCE
