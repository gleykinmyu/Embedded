openapi: 3.1.0
info:
  title: ESP_CAM Bridge API
  version: 0.1.0
  summary: Semantic HTTP API for the pan/tilt head, the camera, and the bridge.
  description: |
    This document is the only description of the bridge HTTP API.
    Firmware in this repository does not implement it yet.

    The bridge is an ESP32 in front of a pan/tilt head and a camera.
    Clients talk about aim, motion, optics, presets, and picture settings.
    They do not send protocol command names.

    ## Resources

    Motion is continuous pan, tilt, zoom, and focus. Home means "go to the
    home pose". On some heads that pose is a stored preset; the client still
    does not send a preset number.

    Aim is pan and tilt as a pose. Optics is the head lens (zoom, focus, iris).
    They are different resources because a head can support one without the
    other. The bridge must not invent a center aim when the head cannot report
    pan and tilt. Camera exposure iris is not head optics: it lives under
    `/api/camera/iris`.

    Picture settings are camera-menu values. `GET /api/camera/catalog` and
    `GET /api/camera/osd/catalog` describe the selected model. Those payloads
    are built from ccam. This file fixes their shape, not the per-model lists.
    A write whose token is absent from that catalog is `invalid_parameter`.

    `GET /api/status` is one observation for the poll. The body is nested so
    network, head, camera, motion, presets, and limits stay separate objects.
    It does not accept writes.

    Installation, accessories, and bridge settings are separate writes.
    They are not fields of one configuration object.

    ## Capabilities

    `head.capabilities` and `camera.capabilities` in the status body are the
    ccam flags for the models selected on the bridge. An operation with
    `x-capability` returns 403 `unsupported` and does not use the bus when
    that flag is false. `x-capability-when` names the flag for one case only:
    plain power-on does not need `power_camera_link`, and menu keys other than
    left and right do not need `menu_left_right`. An operation with neither
    extension is offered for every model; the device may still answer with
    `device_rejected`.

    A query with no user value that the model class does not implement is
    `unsupported`. A value the device refuses after the capability check is
    `device_rejected`.

    ## Envelope

    Success JSON is `{"ok": true, "data": ...}`.
    Errors are `{"ok": false, "error": {"code", "message", "details"?}}`
    and use the HTTP status of the failure. A device failure is not HTTP 200.

    `GET /api/camera/values` is the exception. The body is `application/x-ndjson`:
    one JSON object per line, not an array and not the success envelope.
    If the camera transmitter is already down, the bridge returns 503 JSON
    and does not start the stream.

    JSON responses send `Cache-Control: no-store`.
    Request bodies are JSON objects. Unknown fields are `invalid_parameter`.
    Numbers are rejected when trailing junk is present. The largest accepted
    JSON body is 1024 bytes.

    ## Authorization

    `operator` is the cookie `esp_sess` plus header `X-Esp-Client: ui`.
    The cookie is HttpOnly and SameSite=Lax. Idle life is 30 to 300 seconds.
    On `GET /api/status`, an operator cookie slides that timer only when
    `X-Esp-Active` is exactly `1`. A missing header and any other value do
    nothing. A service token ignores the header. Ending the
    session, including logout and idle expiry, stops pan, tilt, zoom, and focus.
    Session idle and the movement safety timeout are independent. Stopping
    axes because the session expired does not replace the movement watchdog.

    `service` is `Authorization: Bearer`. The token does not expire. It is for
    a backend talking to the bridge. It cannot change the password, the session
    lifetime, the token, or raw-protocol access.

    Challenge and login are anonymous and still require `X-Esp-Client: ui`.
    The session probe is anonymous; a presented credential is reported in the body.

    `proof` is SHA-256 of the one-time nonce and the stored password hash.
    SHA-256 has no work factor. A party that sees the salt, that nonce, and a
    matching proof can test password guesses without talking to the bridge.
    `new_password_hash` is the same kind of hash: SHA-256 of `next_salt` and
    the new password. The password itself is not sent.

    Direct mode: the page and this API share an origin, and the page uses the
    operator cookie. External mode: a backend implements this same contract
    toward the browser and calls the bridge with the bearer token. The browser
    does not receive that token. The bridge does not enable cross-origin access.

    Secrets (token, password proof, password hash) are never placed in a URL
    or written to a log.

    ## Raw protocol

    `POST /api/diagnostics/protocol/head` and `.../camera` bypass the semantic
    API. Access is `disabled`, `operator` (the default), or `all`.
    Only an operator can change it, so a service token cannot unlock raw frames
    for itself. The serial CLI is outside this policy.

    ## Dispatcher

    The bridge registers a static ESP-IDF `httpd` table and uses the built-in
    wildcard match only for the patterns in `x-dispatcher`. Camera writes share
    one handler because they share authentication, the JSON check, and the
    device lock. Unknown `/api` paths return 404 `not_found` with this error
    envelope. That table is not a general HTTP framework.

servers:
  - url: /
    description: |
      Same-origin base. In direct mode this is the bridge. In external mode
      this is a backend that implements this contract.

tags:
  - name: Session
    description: Operator sign-in, session lifetime, and the service token.
  - name: Status
    description: One read-only observation of the bridge, the head, and the camera.
  - name: Motion
    description: Continuous movement, full stop, home, and the default rate.
  - name: Power
    description: Head power.
  - name: Aim
    description: Reported or absolute pan/tilt. Absent when the head cannot provide it.
  - name: Optics
    description: Head lens pose. Not the camera exposure iris.
  - name: Presets
    description: Stored poses and how the head travels to them.
  - name: Limits
    description: End-of-travel limits.
  - name: Installation
    description: How the head is mounted.
  - name: Accessories
    description: Head outputs that are not part of aiming.
  - name: Bridge
    description: Which models the bridge speaks, and the bridge IPv4 settings.
  - name: Camera
    description: Camera picture, menu, and OSD. Ranges come from the catalog.
  - name: Diagnostics
    description: Separate status reads, plus the optional raw protocol.

security:
  - uiSession: []
  - bearerAuth: []

x-dispatcher:
  runtime: esp-idf-httpd
  match: httpd_uri_match_wildcard
  note: >
    Register specific paths before wildcards, and register /api/* last.
    Raise max_uri_handlers to the size of this table. Inside /api/camera/*
    and /api/diagnostics/* a fixed suffix table selects the operation.
    Any other suffix is 404 not_found.
  handlers:
    - {uri: /api/status, methods: [GET]}
    - {uri: /api/auth/*, methods: [GET, POST, PUT]}
    - {uri: /api/motion, methods: [POST]}
    - {uri: /api/motion/*, methods: [POST, PUT]}
    - {uri: /api/power, methods: [POST]}
    - {uri: /api/aim, methods: [GET, PUT]}
    - {uri: /api/optics, methods: [GET, PATCH]}
    - {uri: /api/optics/*, methods: [PUT]}
    - {uri: /api/presets, methods: [GET]}
    - {uri: /api/presets/*, methods: [GET, POST, PUT, DELETE]}
    - {uri: /api/limits/*, methods: [POST, PUT]}
    - {uri: /api/installation/*, methods: [PUT, PATCH]}
    - {uri: /api/fans/*, methods: [PUT]}
    - {uri: /api/tally, methods: [PUT]}
    - {uri: /api/wireless-control, methods: [PUT]}
    - {uri: /api/washer, methods: [PUT]}
    - {uri: /api/option-output, methods: [PUT]}
    - {uri: /api/wiper, methods: [PUT]}
    - {uri: /api/bridge/models, methods: [PUT]}
    - {uri: /api/network, methods: [PUT]}
    - {uri: /api/camera/*, methods: [GET, PUT, POST]}
    - {uri: /api/diagnostics/*, methods: [GET, PUT, POST]}
    - {uri: /api/*, methods: [GET, POST, PUT, PATCH, DELETE]}

paths:
  /api/auth/challenge:
    post:
      tags: [Session]
      operationId: createAuthChallenge
      summary: Start an operator login
      description: |
        Anonymous. Requires `X-Esp-Client: ui`. Returns the current salt,
        a one-time nonce, and the salt to use for a later password change.
        The password is not sent. `proof` for login is SHA-256(nonce concatenated
        with the stored password hash).
      x-auth: [anonymous]
      security: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/login:
    post:
      tags: [Session]
      operationId: login
      summary: Open an operator session
      description: |
        Anonymous. Requires `X-Esp-Client: ui`. On success the bridge sets
        cookie `esp_sess`. A new login ends any other operator session.
      x-auth: [anonymous]
      security: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session opened
          headers:
            Set-Cookie:
              description: '`esp_sess=<token>; Path=/; HttpOnly; SameSite=Lax`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: End the operator session
      description: |
        Operator only. Clears the cookie. The bridge then stops pan, tilt,
        zoom, and focus, because the page may have been holding a move.
      x-auth: [operator]
      security:
        - uiSession: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      responses:
        "200":
          description: Session ended
          headers:
            Set-Cookie:
              description: Cookie cleared with Max-Age=0.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Report who is calling
      description: |
        Anonymous. A cookie or bearer token may be sent and is reflected in
        `method`. This call does not fail with 401 when nobody is signed in.
      x-auth: [anonymous, operator, service]
      security: []
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      responses:
        "200":
          description: Current caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"

  /api/auth/password:
    put:
      tags: [Session]
      operationId: changePassword
      summary: Change the operator password
      description: |
        Operator only. A service token is `forbidden`.
        `proof` is SHA-256(nonce concatenated with the current hash).
        `new_password_hash` is SHA-256(next_salt concatenated with the new password).
        The password itself is not in the body. Fetch a challenge first.
      x-auth: [operator]
      security:
        - uiSession: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/session/ttl:
    put:
      tags: [Session]
      operationId: setSessionTtl
      summary: Set the operator idle lifetime
      description: Operator only. Does not affect the service token.
      x-auth: [operator]
      security:
        - uiSession: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionTtl"
      responses:
        "200":
          description: Lifetime updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTtlResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/token:
    get:
      tags: [Session]
      operationId: getApiToken
      summary: Read the service token
      description: |
        Operator only. Exists so a person at the bridge can copy the token
        into a backend. An external web page must not call this. Do not log
        the token.
      x-auth: [operator]
      security:
        - uiSession: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      responses:
        "200":
          description: Current service token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/token/reissue:
    post:
      tags: [Session]
      operationId: reissueApiToken
      summary: Replace the service token
      description: |
        Operator only. The previous bearer token stops working immediately.
        Do not log the new token.
      x-auth: [operator]
      security:
        - uiSession: []
      parameters:
        - $ref: "#/components/parameters/UiClientRequired"
      responses:
        "200":
          description: New service token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Read the bridge observation
      description: |
        Does not query the head or the camera. Link health, capabilities,
        and the last known limits are cached on the bridge.
        For an operator cookie, idle slides only when `X-Esp-Active` is
        exactly `1`. A missing header and any other value are ignored.
        A service token ignores the header. `500` means the bridge could
        not encode its own state (`internal` or `buffer`).
      x-auth: [operator, service]
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
        - $ref: "#/components/parameters/EspActive"
      responses:
        "200":
          description: Current observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/motion:
    post:
      tags: [Motion]
      operationId: move
      summary: Move one or more axes
      description: |
        At least one axis is required. An omitted axis is left as it is,
        and its movement deadline is not renewed. `stop` on an axis stops
        that axis immediately and clears its deadline. `rate` is 1 (slow)
        to 100 (fast); when omitted, the bridge uses the stored default.

        A successfully accepted command starts or renews movement on the
        named axes. The client repeats the command about every 250 ms while
        movement should continue. The bridge uses a fixed 800 ms safety
        timeout. Each axis has its own deadline. A repeat that is accepted
        updates the deadline of each axis named in that command. If an axis
        is not renewed in time, the bridge stops that axis itself.

        Pan and tilt are applied together when both are directions.
        Zoom and focus follow. If a later axis fails, earlier axes may
        already be moving: `details.applied_axes` lists them and
        `details.failed_axis` names the failure. The client should then stop.
      x-auth: [operator, service]
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MotionCommand"
            example:
              pan: left
              tilt: up
              rate: 30
      responses:
        "200":
          description: Axes accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/motion/stop:
    post:
      tags: [Motion]
      operationId: stopMotion
      summary: Stop pan, tilt, zoom, and focus
      description: |
        No body. This is the release path for a held control. It always
        targets all four axes, including when the pointer is cancelled.
        It stops pan, tilt, zoom, and focus immediately and clears every
        movement deadline.
      x-auth: [operator, service]
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      responses:
        "200":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/motion/home:
    post:
      tags: [Motion]
      operationId: goHome
      summary: Go to the home pose
      description: |
        The home pose is defined by the head. The client does not choose a
        preset. The bridge cancels current velocity holds before home begins.
        The next status read shows whether a preset is now active.
      x-auth: [operator, service]
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      responses:
        "200":
          description: Home accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/motion/rate:
    put:
      tags: [Motion]
      operationId: setMotionRate
      summary: Store the default move rate
      description: |
        Used when a move omits `rate`. This does not move the head.
        Changing the default rate does not renew a movement lease.
      x-auth: [operator, service]
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateSetting"
      responses:
        "200":
          description: Rate stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/power:
    post:
      tags: [Power]
      operationId: setPower
      summary: Set head power
      description: |
        `camera_link` selects whether power-on also enables the camera
        transmitter. It is allowed only when `power_camera_link` is true.
        Omit it for a plain power-on. It cannot be combined with `off`.
      x-auth: [operator, service]
      x-capability-when:
        camera_link: power_camera_link
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerCommand"
            example:
              state: "on"
      responses:
        "200":
          description: Power command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/aim:
    get:
      tags: [Aim]
      operationId: getAim
      summary: Read pan and tilt
      description: |
        `view=control` needs capability `aim_control`.
        `view=displayed` needs capability `aim_displayed`.
        The body is pan and tilt only. Lens values are `GET /api/optics`.
        When the capability for the requested view is false the status is
        403 `unsupported`. The bridge does not fill pan and tilt with the
        center value.
      x-auth: [operator, service]
      x-capability-when:
        control: aim_control
        displayed: aim_displayed
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
        - $ref: "#/components/parameters/AimView"
      responses:
        "200":
          description: Aim reported by the head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AimResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    put:
      tags: [Aim]
      operationId: setAim
      summary: Set absolute pan and tilt
      description: |
        Needs capability `absolute_aim`. Both axes are required.
        Units are device units, 0 to 65535, not degrees.
      x-auth: [operator, service]
      x-capability: absolute_aim
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AimTarget"
      responses:
        "200":
          description: Aim command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AimTargetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/optics:
    get:
      tags: [Optics]
      operationId: getOptics
      summary: Read zoom, focus, and iris
      description: |
        Head lens pose. Needs capability `optics`.
        This is not the camera exposure iris and not an aim reading.
      x-auth: [operator, service]
      x-capability: optics
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      responses:
        "200":
          description: Lens pose
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpticsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    patch:
      tags: [Optics]
      operationId: setOptics
      summary: Set one or more lens axes
      description: |
        Needs capability `optics`. At least one of zoom, focus, iris.
        An omitted axis is left unchanged. `null` is not a value and is
        `invalid_parameter`. An empty object is `invalid_parameter`.
        Units match `GET /api/optics`.
      x-auth: [operator, service]
      x-capability: optics
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpticsTarget"
      responses:
        "200":
          description: Lens command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpticsTargetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"

  /api/optics/position-control:
    put:
      tags: [Optics]
      operationId: setOpticsPositionControl
      summary: Enable lens position control
