    get:
      tags: [Camera]
      operationId: getCameraCatalog
      summary: Describe picture settings for the selected camera
      description: |
        No bus traffic. Built from ccam for the selected camera model.
        Choice lists and numeric ranges in this payload are the authority
        for later writes. This document does not freeze those lists.
      x-auth: [operator, service]
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
      responses:
        "200":
          description: Catalog for the selected model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraCatalogResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/camera/values:
    get:
      tags: [Camera]
      operationId: readCameraValues
      summary: Stream current picture values
      description: |
        Finite NDJSON stream. The body is not a JSON array and not the
        success envelope. Each line is one CameraValueLine terminated by LF.
        The media type is application/x-ndjson.

        The first line is start. Later lines are phase, sample, and a final
        end. A failed sample sets error and omits value; the stream continues.
        scope=dependencies reads only values whose gate the bridge has just
        evaluated. The client does not send gates. name may be repeated to
        keep a subset.

        If the camera transmitter is down before the stream starts, the
        response is 503 JSON camera_unavailable and no line is sent.
        If the link fails mid-stream, the last line is end with complete false.
      x-auth: [operator, service]
      x-ndjson: true
      parameters:
        - $ref: "#/components/parameters/UiClientOptional"
        - $ref: "#/components/parameters/ValueScope"
        - $ref: "#/components/parameters/ValueNames"
      responses:
        "200":
          description: NDJSON lines. The schema describes one line, not the whole body.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/CameraValueLine"
              x-ndjson: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

