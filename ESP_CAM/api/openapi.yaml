        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
components:
  securitySchemes:
    uiSession:
      type: apiKey
      in: cookie
      name: esp_sess
      description: |
        Operator session. HttpOnly, SameSite=Lax, idle life 30 to 300 seconds.
        Requests also send X-Esp-Client: ui. Ending the session stops pan,
        tilt, zoom, and focus. A service token does not open this session.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Server-to-device token. It does not expire. It cannot change the
        password, the session lifetime, the token, or raw-protocol access.
        Do not put it in a URL, a browser application, or a log.

  parameters:
    UiClientRequired:
      name: X-Esp-Client
      in: header
      required: true
      schema:
        const: ui
      description: Marks the call as coming from the bridge page.
    UiClientOptional:
      name: X-Esp-Client
      in: header
      required: false
      schema:
        const: ui
      description: Required together with the operator cookie. Omit it for a service token.
    EspActive:
      name: X-Esp-Active
      in: header
      required: false
      schema:
        type: string
      description: |
        Used by GET /api/status. For an operator cookie, the exact value
        "1" slides the idle timer. A missing header and any other value
        are ignored. A service token ignores this header.
    AimView:
      name: view
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AimView"
      description: Defaults to control.
    PresetId:
      name: preset
      in: path
      required: true
      description: Canonical decimal 1 to 99, without a sign, leading zeros, or trailing characters.
      schema:
        type: integer
        minimum: 1
        maximum: 99
    LimitAxis:
      name: axis
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/LimitAxis"
    FanId:
      name: fan
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FanId"
    OsdName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,31}$"
    ValueScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [full, dependencies]
        default: full
      description: |
        full reads the picture. dependencies reads only values gated by the
        primary state the bridge just measured.
    ValueNames:
      name: name
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 64
      description: When set, the stream reads only these sample names.

  responses:
    BadRequest:
      description: A field is missing, the wrong type, out of range, or not in the model catalog.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error:
              code: invalid_parameter
              message: rate must be 1..100
              details:
                field: rate
    Unauthorized:
      description: The credential is missing or rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error:
              code: unauthorized
              message: Authentication required
              details:
                session_seconds_left: 0
                session_ttl_seconds: 300
                session_active: false
    Forbidden:
      description: |
        The caller is authenticated but not allowed. code is forbidden for the
        wrong credential class, unsupported when a capability flag is false,
        and protocol_disabled when raw access blocks this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            ok: false
            error:
              code: unsupported
              message: This head does not report pan and tilt
              details:
                capability: aim_control
    NotFound:
      description: The path or OSD name does not exist. code is not_found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The head or camera rejected the command. code is device_rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Bridge failure. code is buffer or internal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: |
        Temporary. ota_busy while firmware is uploading, device_io when the
        bus transfer fails, camera_unavailable when the camera transmitter is down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: The head or camera did not answer in time. code is device_timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorCode:
      type: string
      description: |
        invalid_parameter is HTTP 400. unauthorized is 401.
        forbidden, unsupported, and protocol_disabled are 403.
        not_found is 404. device_rejected is 409.
        buffer and internal are 500.
        ota_busy, device_io, and camera_unavailable are 503.
        device_timeout is 504.
      enum:
        - invalid_parameter
        - unauthorized
        - forbidden
        - unsupported
        - protocol_disabled
        - not_found
        - device_rejected
        - buffer
        - internal
        - ota_busy
        - device_io
        - camera_unavailable
        - device_timeout
    ErrorDetails:
      type: object
      description: Present only when the error has extra fields. Unknown keys may be added later.
      properties:
        field:
          type: string
        capability:
          type: string
        failed_axis:
          enum: [pan, tilt, zoom, focus]
        applied_axes:
          type: array
          uniqueItems: true
          description: Axes already accepted before the failure. Each axis at most once.
          items:
            enum: [pan, tilt, zoom, focus]
        session_seconds_left:
          type: integer
          minimum: 0
        session_ttl_seconds:
          type: integer
          minimum: 0
        session_active:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        details:
          $ref: "#/components/schemas/ErrorDetails"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/Error"
    Ack:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: false
          required: [applied]
          properties:
            applied:
              type: boolean
              const: true
    Sha256Hex:
      type: string
      pattern: "^[0-9a-fA-F]{64}$"
    SaltHex:
      type: string
      pattern: "^[0-9a-fA-F]{32}$"
    DeviceUnit:
      type: integer
      minimum: 0
      maximum: 65535
      description: Device units. Not degrees and not a focal length. Center is 32768 where the head uses that convention.
    AimView:
      type: string
      enum: [control, displayed]
    LimitAxis:
      type: string
      enum: [tilt_up, tilt_down, pan_left, pan_right]
    LimitIndicator:
      type: string
      enum: [unknown, clear, set]
    FanId:
      type: string
      enum: [primary, secondary]
    HeadModel:
      type: string
      enum: [ph350, ph360, ph650, ph405, he130, he870, ue150, iptz]
    CameraModel:
      type: string
      enum: [e650, e600, he130, he870, ue150]
    Ipv4:
      type: string
      format: ipv4
    Challenge:
      type: object
      additionalProperties: false
      required: [salt, nonce, next_salt]
      properties:
        salt:
          $ref: "#/components/schemas/SaltHex"
        nonce:
          $ref: "#/components/schemas/SaltHex"
        next_salt:
          $ref: "#/components/schemas/SaltHex"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [user, proof]
      properties:
        user:
          type: string
          minLength: 1
          maxLength: 32
        proof:
          $ref: "#/components/schemas/Sha256Hex"
    LoginSession:
      type: object
      additionalProperties: false
      required: [user, ttl_seconds]
      properties:
        user:
          type: string
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 300
    SessionView:
      type: object
      additionalProperties: false
      required: [authenticated, method]
      properties:
        authenticated:
          type: boolean
        method:
          enum: [none, operator, service]
        user:
          type: string
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 300
        seconds_left:
          type: [integer, "null"]
          minimum: 0
        ttl_min_seconds:
          type: integer
        ttl_max_seconds:
          type: integer
    PasswordChange:
      type: object
      additionalProperties: false
      required: [proof, new_password_hash]
      properties:
        proof:
          $ref: "#/components/schemas/Sha256Hex"
        new_password_hash:
          $ref: "#/components/schemas/Sha256Hex"
    SessionTtl:
      type: object
      additionalProperties: false
      required: [ttl_seconds]
      properties:
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 300
    Token:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: "^[A-Za-z0-9]{32}$"
    HeadCapabilities:
      type: object
      additionalProperties: false
      description: ccam flags for the selected head. An operation with the same x-capability is unsupported when the flag is false.
      required:
        - absolute_aim
        - absolute_aim_speed
        - preset_map
        - preset_options
        - limit_set
        - limit_toggle
        - tally
        - fan
        - wiper
        - washer
        - wireless
        - option
        - tilt_span
        - heater
        - defroster
        - aim_control
        - aim_displayed
        - optics
        - exposure_reading
        - landing
        - head_version
        - power_camera_link
      properties:
        absolute_aim: {type: boolean}
        absolute_aim_speed: {type: boolean}
        preset_map: {type: boolean}
        preset_options: {type: boolean}
        limit_set: {type: boolean}
        limit_toggle: {type: boolean}
        tally: {type: boolean}
        fan: {type: boolean}
        wiper: {type: boolean}
        washer: {type: boolean}
        wireless: {type: boolean}
        option: {type: boolean}
        tilt_span: {type: boolean}
        heater: {type: boolean}
        defroster: {type: boolean}
        aim_control: {type: boolean}
        aim_displayed: {type: boolean}
        optics: {type: boolean}
        exposure_reading: {type: boolean}
        landing: {type: boolean}
        head_version: {type: boolean}
        power_camera_link: {type: boolean}
    CameraCapabilities:
      type: object
      additionalProperties: false
      description: ccam flags for the selected camera.
      required:
        - hd_detail
        - negative
        - scan
        - chroma
        - black_shade
        - synchro
        - black_balance
        - paint
        - genlock
        - gamma
        - agc_ceiling
        - master_detail
        - monitor
        - lens_interface
        - menu_left_right
      properties:
        hd_detail: {type: boolean}
        negative: {type: boolean}
        scan: {type: boolean}
        chroma: {type: boolean}
        black_shade: {type: boolean}
        synchro: {type: boolean}
        black_balance: {type: boolean}
        paint: {type: boolean}
        genlock: {type: boolean}
        gamma: {type: boolean}
        agc_ceiling: {type: boolean}
        master_detail: {type: boolean}
        monitor: {type: boolean}
        lens_interface: {type: boolean}
        menu_left_right: {type: boolean}
    NetworkLive:
      type: object
      additionalProperties: false
      required: [link, address, mask, gateway, mac]
      properties:
        link: {type: boolean}
        address: {$ref: "#/components/schemas/Ipv4"}
        mask: {$ref: "#/components/schemas/Ipv4"}
        gateway: {$ref: "#/components/schemas/Ipv4"}
        mac:
          type: string
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
    SessionSnapshot:
      type: object
      additionalProperties: false
      required: [ttl_seconds, seconds_left]
      properties:
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 300
        seconds_left:
          type: [integer, "null"]
          minimum: 0
          description: Null when the caller is a service token.
    HeadPower:
      type: object
      additionalProperties: false
      required: [state, label]
      properties:
        state:
          enum: ["off", "on", "on_camera_tx", "on_no_camera_tx", starting, control_off, unknown]
        label:
          type: string
        code:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Raw power byte. Null when the head has not reported one.
    HeadSnapshot:
      type: object
      additionalProperties: false
      required: [model, name, alive, power, powered, optics_alive, optics_fail_count, fail_count, error_code, capabilities]
      properties:
        model: {$ref: "#/components/schemas/HeadModel"}
        name: {type: string}
        alive: {type: boolean}
        power: {$ref: "#/components/schemas/HeadPower"}
        powered: {type: boolean}
        optics_alive: {type: boolean}
        optics_fail_count: {type: integer, minimum: 0}
        fail_count: {type: integer, minimum: 0}
        error_code:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
          description: Null when the head has not reported a fault code.
        capabilities: {$ref: "#/components/schemas/HeadCapabilities"}
    CameraSnapshot:
      type: object
      additionalProperties: false
      required: [model, name, transmitter, alive, identifier, fail_count, capabilities]
      properties:
        model: {$ref: "#/components/schemas/CameraModel"}
        name: {type: string}
        transmitter: {type: boolean}
        alive: {type: boolean}
        identifier:
          type: string
          description: Camera id string. Empty when the camera has not answered.
        fail_count: {type: integer, minimum: 0}
        capabilities: {$ref: "#/components/schemas/CameraCapabilities"}
    AxisOrientation:
      type: object
      additionalProperties: false
      required: [pan, tilt, zoom, focus]
      properties:
        pan: {type: boolean}
        tilt: {type: boolean}
        zoom: {type: boolean}
        focus: {type: boolean}
      description: True means the bridge reverses that control direction.
    AxisOrientationPatch:
      type: object
      additionalProperties: false
      description: |
        At least one axis. An omitted axis is unchanged. null is invalid.
        The booleans do not include null.
      minProperties: 1
      anyOf:
        - required: [pan]
        - required: [tilt]
        - required: [zoom]
        - required: [focus]
      properties:
        pan: {type: boolean}
        tilt: {type: boolean}
        zoom: {type: boolean}
        focus: {type: boolean}
    MotionSnapshot:
      type: object
      additionalProperties: false
      required: [rate, orientation]
      properties:
        rate:
          type: integer
          minimum: 1
          maximum: 100
        orientation:
          $ref: "#/components/schemas/AxisOrientation"
    PresetSnapshot:
      type: object
      additionalProperties: false
      required: [latest, active]
      properties:
        latest:
          type: [integer, "null"]
          minimum: 1
          maximum: 99
        active: {type: boolean}
    LimitSnapshot:
      type: object
      additionalProperties: false
      required: [tilt_up, tilt_down, pan_left, pan_right]
      properties:
        tilt_up: {$ref: "#/components/schemas/LimitIndicator"}
        tilt_down: {$ref: "#/components/schemas/LimitIndicator"}
        pan_left: {$ref: "#/components/schemas/LimitIndicator"}
        pan_right: {$ref: "#/components/schemas/LimitIndicator"}
    BridgeStatus:
      type: object
      additionalProperties: false
      required: [network, uptime_seconds, session, head, camera, motion, presets, limits]
      properties:
        network: {$ref: "#/components/schemas/NetworkLive"}
        uptime_seconds: {type: integer, minimum: 0}
        session: {$ref: "#/components/schemas/SessionSnapshot"}
        head: {$ref: "#/components/schemas/HeadSnapshot"}
        camera: {$ref: "#/components/schemas/CameraSnapshot"}
        motion: {$ref: "#/components/schemas/MotionSnapshot"}
        presets: {$ref: "#/components/schemas/PresetSnapshot"}
        limits: {$ref: "#/components/schemas/LimitSnapshot"}
    MotionCommand:
      type: object
      additionalProperties: false
      anyOf:
        - required: [pan]
        - required: [tilt]
        - required: [zoom]
        - required: [focus]
      properties:
        pan: {enum: [left, right, stop]}
        tilt: {enum: [up, down, stop]}
        zoom: {enum: [tele, wide, stop]}
        focus: {enum: [far, near, stop]}
        rate: {type: integer, minimum: 1, maximum: 100}
    MotionAccepted:
      type: object
      additionalProperties: false
      required: [axes, rate]
      properties:
        axes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [pan, tilt, zoom, focus]}
        rate: {type: integer, minimum: 1, maximum: 100}
    StopAccepted:
      type: object
      additionalProperties: false
      required: [axes]
      properties:
        axes:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          description: Each of pan, tilt, zoom, and focus, once.
          items: {enum: [pan, tilt, zoom, focus]}
    RateSetting:
      type: object
      additionalProperties: false
      required: [rate]
      properties:
        rate: {type: integer, minimum: 1, maximum: 100}
    PowerCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {const: "off"}
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {const: "on"}
            camera_link: {enum: [enable, disable]}
    AimReading:
      type: object
      additionalProperties: false
      required: [view, pan, tilt]
      properties:
        view: {$ref: "#/components/schemas/AimView"}
        pan: {$ref: "#/components/schemas/DeviceUnit"}
        tilt: {$ref: "#/components/schemas/DeviceUnit"}
    AimTarget:
      type: object
      additionalProperties: false
      required: [pan, tilt]
      properties:
        pan: {$ref: "#/components/schemas/DeviceUnit"}
        tilt: {$ref: "#/components/schemas/DeviceUnit"}
    OpticsReading:
      type: object
      additionalProperties: false
      required: [zoom, focus, iris]
      description: Normalized head-lens units, 0 toward wide, near, and closed.
      properties:
        zoom: {$ref: "#/components/schemas/DeviceUnit"}
        focus: {$ref: "#/components/schemas/DeviceUnit"}
        iris: {$ref: "#/components/schemas/DeviceUnit"}
    OpticsTarget:
      type: object
      additionalProperties: false
      description: |
        At least one of zoom, focus, and iris. An omitted axis is unchanged.
        null is invalid. The types do not include null.
      anyOf:
        - required: [zoom]
        - required: [focus]
        - required: [iris]
      properties:
        zoom: {$ref: "#/components/schemas/DeviceUnit"}
        focus: {$ref: "#/components/schemas/DeviceUnit"}
        iris: {$ref: "#/components/schemas/DeviceUnit"}
    Enabled:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    PresetList:
      type: object
      additionalProperties: false
      required: [occupied]
      properties:
        occupied:
          type: array
          uniqueItems: true
          description: Occupied preset numbers. Each number appears once.
          items: {type: integer, minimum: 1, maximum: 99}
    LatestPreset:
      type: object
      additionalProperties: false
      required: [number, active]
      properties:
        number:
          type: [integer, "null"]
          minimum: 1
          maximum: 99
        active: {type: boolean}
    PresetNumber:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: {type: integer, minimum: 1, maximum: 99}
    PresetPath:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: {enum: [normal, diagonal]}
    PresetSpeed:
      type: object
      additionalProperties: false
      required: [speed]
      properties:
        speed: {enum: [slow, mid, fast]}
    PresetSpeedTable:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 4095
          description: 12-bit preset speed table entry.
    LimitWrite:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {enum: [clear, set]}
    LimitState:
      type: object
      additionalProperties: false
      required: [axis, state]
      properties:
        axis: {$ref: "#/components/schemas/LimitAxis"}
        state: {enum: [clear, set]}
    TiltSpan:
      type: object
      additionalProperties: false
      required: [span]
      properties:
        span: {enum: [narrow, wide]}
    WiperMode:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {enum: ["off", fast, slow]}
    FanMode:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {enum: [auto, high, mid, low]}
    FanApplied:
      type: object
      additionalProperties: false
      required: [fan, mode]
      properties:
        fan: {$ref: "#/components/schemas/FanId"}
        mode: {enum: [auto, high, mid, low]}
    BridgeModels:
      type: object
      additionalProperties: false
      required: [head, camera]
      properties:
        head: {$ref: "#/components/schemas/HeadModel"}
        camera: {$ref: "#/components/schemas/CameraModel"}
    BridgeModelsApplied:
      type: object
      additionalProperties: false
      required: [head, camera, head_name, camera_name]
      properties:
        head: {$ref: "#/components/schemas/HeadModel"}
        camera: {$ref: "#/components/schemas/CameraModel"}
        head_name: {type: string}
        camera_name: {type: string}
    NetworkConfig:
      type: object
      additionalProperties: false
      required: [address, mask]
      properties:
        address: {$ref: "#/components/schemas/Ipv4"}
        mask: {$ref: "#/components/schemas/Ipv4"}
        gateway: {$ref: "#/components/schemas/Ipv4"}
    NetworkApplied:
      type: object
      additionalProperties: false
      required: [address, mask, gateway, reboot]
      properties:
        address: {$ref: "#/components/schemas/Ipv4"}
        mask: {$ref: "#/components/schemas/Ipv4"}
        gateway: {$ref: "#/components/schemas/Ipv4"}
        reboot: {type: boolean, const: true}
    LabeledChoice:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: {type: string}
        label: {type: string}
    ChoiceParameter:
      type: object
      additionalProperties: false
      required: [kind, choices]
      properties:
        kind: {const: choices}
        choices:
          type: array
          items: {$ref: "#/components/schemas/LabeledChoice"}
    RangeParameter:
      type: object
      additionalProperties: false
      description: |
        Inclusive range published in the camera catalog. The bridge emits
        this object only when minimum is less than or equal to maximum.
        That check is made while the catalog is built. This schema does not
        compare the two fields.
      required: [kind, minimum, maximum, digits]
      properties:
        kind: {const: hex_range}
        minimum: {type: integer, minimum: 0}
        maximum: {type: integer, minimum: 0}
        digits: {type: integer, minimum: 1, maximum: 8}
    ParameterSpec:
      oneOf:
        - $ref: "#/components/schemas/ChoiceParameter"
        - $ref: "#/components/schemas/RangeParameter"
    CameraParameterSet:
      type: object
      additionalProperties: false
      description: |
        Present keys depend on the selected camera. Names are the API names.
        ccam catalog keys map as awc to white_balance, agc_max to agc_ceiling,
        total_dtl to master_detail, and colorbar to bars. The other names match.
      properties:
        white_balance: {$ref: "#/components/schemas/ParameterSpec"}
        scene: {$ref: "#/components/schemas/ParameterSpec"}
        shutter: {$ref: "#/components/schemas/ParameterSpec"}
        synchro: {$ref: "#/components/schemas/ParameterSpec"}
        gamma: {$ref: "#/components/schemas/ParameterSpec"}
        agc_ceiling: {$ref: "#/components/schemas/ParameterSpec"}
        master_detail: {$ref: "#/components/schemas/ParameterSpec"}
        genlock: {$ref: "#/components/schemas/ParameterSpec"}
        bars: {$ref: "#/components/schemas/ParameterSpec"}
    CameraDependency:
      type: object
      additionalProperties: false
      required: [name, gate]
      properties:
        name: {type: string}
        gate:
          type: string
          description: Gate id from the ccam menu table. The client does not send gates back.
    CameraCatalog:
      type: object
      additionalProperties: false
      required: [camera, parameters, dependencies]
      properties:
        camera: {$ref: "#/components/schemas/CameraModel"}
        parameters: {$ref: "#/components/schemas/CameraParameterSet"}
        dependencies:
          type: array
          items: {$ref: "#/components/schemas/CameraDependency"}
    OsdLinear:
      type: object
      additionalProperties: false
      required: [name, group, title, kind, minimum, maximum]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        group: {type: string}
        title: {type: string}
        note: {type: string}
        kind: {const: linear}
        minimum: {type: integer}
        maximum: {type: integer}
        bias: {type: integer}
        unit: {type: string}
        low_label: {type: string}
        high_label: {type: string}
    OsdChoices:
      type: object
      additionalProperties: false
      required: [name, group, title, kind, choices]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        group: {type: string}
        title: {type: string}
        note: {type: string}
        kind: {const: choices}
        choices:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/LabeledChoice"}
    OsdDescriptor:
      description: |
        linear requires minimum and maximum and has no choices.
        choices requires a non-empty choices list and has no scale fields.
      oneOf:
        - $ref: "#/components/schemas/OsdLinear"
        - $ref: "#/components/schemas/OsdChoices"
      discriminator:
        propertyName: kind
        mapping:
          linear: "#/components/schemas/OsdLinear"
          choices: "#/components/schemas/OsdChoices"
    OsdCatalog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/OsdDescriptor"}
    CatalogChoice:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice: {type: string, minLength: 1, maxLength: 16}
    CatalogNumber:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: integer, minimum: 0}
    CatalogValue:
      description: choice for a choice parameter, value for a hex range. The bridge checks it against the live ccam catalog.
      oneOf:
        - $ref: "#/components/schemas/CatalogChoice"
        - $ref: "#/components/schemas/CatalogNumber"
    CameraValuesStarted:
      type: object
      additionalProperties: false
      required: [event, scope, camera]
      properties:
        event: {const: start}
        scope: {enum: [full, dependencies]}
        camera: {$ref: "#/components/schemas/CameraModel"}
    CameraSampleName:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Core names are shutter, synchro, gain_mode, gain_step, iris_mode,
        iris, nd, white_balance, chroma, red_gain, blue_gain, red_pedestal,
        blue_pedestal, master_pedestal, detail, hd_detail, master_detail,
        gamma, agc_ceiling, noise_reduction, shading, bars, polarity, scan,
        digital_gain, metering_area, metering_peak, scene, genlock, focus,
        menu, model, and version. OSD samples use osd.<catalog name>.
    CameraSampleValue:
      type: object
      additionalProperties: false
      required: [event, name, value]
      properties:
        event: {const: sample}
        name: {$ref: "#/components/schemas/CameraSampleName"}
        value:
          oneOf:
            - {type: string}
            - {type: number}
            - {type: boolean}
    CameraSampleError:
      type: object
      additionalProperties: false
      required: [event, name, error]
      properties:
        event: {const: sample}
        name: {$ref: "#/components/schemas/CameraSampleName"}
        error: {$ref: "#/components/schemas/ErrorCode"}
    CameraValueSample:
      description: One sample. Exactly one of value or error.
      oneOf:
        - $ref: "#/components/schemas/CameraSampleValue"
        - $ref: "#/components/schemas/CameraSampleError"
    CameraValuesPhase:
      type: object
      additionalProperties: false
      required: [event, phase]
      properties:
        event: {const: phase}
        phase: {enum: [primary, dependent, remaining]}
    CameraValuesFinished:
      type: object
      additionalProperties: false
      required: [event, complete]
      properties:
        event: {const: end}
        complete: {type: boolean}
        reason:
          enum: [camera_unavailable, device_timeout, device_io, buffer]
      if:
        properties:
          complete: {const: false}
        required: [complete]
      then:
        required: [event, complete, reason]
      else:
        not:
          required: [reason]
    CameraValueLine:
      description: One NDJSON line. The HTTP body is a sequence of these objects, not a JSON array.
      oneOf:
        - $ref: "#/components/schemas/CameraValuesStarted"
        - $ref: "#/components/schemas/CameraValueSample"
        - $ref: "#/components/schemas/CameraValuesPhase"
        - $ref: "#/components/schemas/CameraValuesFinished"
    ModelName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
    VersionText:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: string}
    OsdWrite:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 16
          pattern: "^[0-9A-Za-z]+$"
    OsdSetting:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        value:
          type: string
    MenuOpen:
      type: object
      additionalProperties: false
      required: [open]
      properties:
        open: {type: boolean}
    MenuKey:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: {enum: [enter, item, "yes", "no", left, right]}
    GainManual:
