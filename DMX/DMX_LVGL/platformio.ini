[platformio]
; Waveshare ESP32-S3-Touch-LCD-7 (custom board conf in src/esp_panel_board_custom_conf.h)
; Short core_dir avoids Windows MAX_PATH issues with Arduino-ESP32 packages
core_dir = C:/pio
default_envs = BOARD_CUSTOM

[env:BOARD_CUSTOM]
framework = arduino
; pioarduino platform with Arduino-ESP32 3.1.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
; Optional high-perf libs (helps RGB anti-drift). Needs Windows Long Paths enabled:
;   platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
monitor_speed = 115200
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
board = BOARD_CUSTOM
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
extra_scripts = pre:extra_script.py
build_flags =
; Arduino related:
    -DCORE_DEBUG_LEVEL=1    ; Set to `5` for full debug output, `0` for none
; LVGL related:
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0    ; RGB LCD
; Include path:
    -I src
