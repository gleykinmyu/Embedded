; DMX-тестер — STM32F407 + Nextion 4.3" 480x272 landscape
;
; Библиотеки: Embedded/libs/ (lib_extra_dirs + library.json)
; DMX лежит в Embedded/DMX — на уровень выше, чем PUMS/Console.
; clangd: pio run -t compiledb -e tester
; HMI: src/UI/nexHmiConfig.hpp — контракт объектов; шрифты — custom_font_gen.

[platformio]
default_envs = tester

[env]
platform = ststm32
board = genericSTM32F407VGT6
board_build.ldscript = ldscripts/STM32F407VGTX_FLASH.ld
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 250000

lib_extra_dirs = ../libs

lib_deps =
    FatFs
    Interfaces
    board
    Nextion
    dmx
    debug

custom_hmi_gen = always
custom_font_gen = always
custom_hmi_file = DMX.HMI
custom_hmi_out = src/UI/nexHmiConfig.hpp

build_flags =
    -std=gnu++17
    -DHSE_VALUE=8000000U
    -DNEX_SESSION_QUEUE_CAPACITY=512
    -Isrc
    -Ilibs/Nextion

monitor_filters = send_on_enter
monitor_echo = yes

[env:tester]

build_src_filter =
    +<*>
    -<testBaud/>
build_flags =
    ${env.build_flags}
    ;-DNEX_DEBUG
    ;-DNEX_TRACE_TX
    ;-DNEX_TRACE_RX

; Только nex::Application + USART2: rest / sendme на 250000, сырой RX.
; pio run -e testBaud -t upload -t monitor
[env:testBaud]
build_src_filter =
    +<board.cpp>
    +<testBaud/main.cpp>
build_flags =
    ${env.build_flags}
    -DNEX_DEBUG
    -DNEX_TRACE_TX
    -DNEX_TRACE_RX
    ;-DNEX_TRACE_RX_WIRE
