; DMX-тестер — STM32F407 + Nextion 10" 1024x600 landscape
;
; Библиотеки: Embedded/libs/ (lib_extra_dirs + library.json)
; DMX лежит в Embedded/DMX — на уровень выше, чем PUMS/Console.
; clangd: pio run -t compiledb -e tester
; HMI: src/UI/nexHmiConfig.hpp — контракт объектов; .HMI собирать в Nextion Editor.

[platformio]
default_envs = tester

[env]
platform = ststm32
board = genericSTM32F407VGT6
board_build.ldscript = ldscripts/STM32F407VGTX_FLASH.ld
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 250000

lib_extra_dirs = ../libs

lib_deps =
    FatFs
    Interfaces
    board
    Nextion
    dmx512
    debug

custom_hmi_gen = off

build_flags =
    -std=gnu++17
    -DHSE_VALUE=8000000U
    -DNEX_SESSION_QUEUE_CAPACITY=512
    -Isrc

monitor_filters = send_on_enter
monitor_echo = yes

[env:tester]
custom_hmi_out = src/UI/nexHmiConfig.hpp
build_src_filter =
    +<*>
build_flags =
    ${env.build_flags}
    -DNEX_DEBUG
