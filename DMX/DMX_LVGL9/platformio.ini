; Waveshare ESP32-S3-Touch-LCD-7 — LVGL 9 + ESP-IDF only (no Arduino)
; Official PlatformIO platform (IDF 5.5.x — совместим с Waveshare RGB/GT911 port)

[platformio]
src_dir = main
core_dir = C:/pio
default_envs = waveshare_s3_touch_7

[env:waveshare_s3_touch_7]
; 6.13.0 = ESP-IDF 5.5.3. Версия 7.x тянет IDF 6.1 и ломает API порта (I2C/RGB).
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
